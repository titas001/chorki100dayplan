<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>দেশ থাকে গল্পে</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,400..800&family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap">
<style>
/* Layout: Chorki streaming-app shell. Sticky nav, one "title page" per slide, a player bar with scrubber and autoplay. A 100-day season told in four coloured chapters. Single dark theme by choice, like the OTT. */
:root{
  --ink:#0c0a0d; --panel:#171316; --panel2:#201a1e; --line:#2e2629;
  --text:#f6f1f2; --muted:#ab9fa4;
  --pink:#ed1d51; --orange:#f5842a; --grad:linear-gradient(100deg,var(--pink),var(--orange));
  --c1:#2fbf7a;  /* অধ্যায় ১ বিজয়: লাল-সবুজের সবুজ */
  --c2:#8cc2ee;  /* অধ্যায় ২ তুষার */
  --c3:#f7b500;  /* অধ্যায় ৩ ফাগুন */
  --c4:#ff5c7f;  /* অধ্যায় ৪ ঈদ ও স্বাধীনতা */
  --c0:#ffa94d;  /* ভূমিকা: থ্যাংকসগিভিং */
  --c5:#ff5c7f;
  --good:#3ccf8e;
  --f-display:"Anek Bangla","Hind Siliguri",system-ui,sans-serif;
  --f-body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --f-quote:"Tiro Bangla","Noto Serif Bengali",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16.5px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:6px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.num{font-variant-numeric:tabular-nums}

/* intro */
.intro{position:fixed;inset:0;z-index:50;background:var(--ink);display:grid;place-items:center;pointer-events:none;animation:introOut .5s ease 1.4s forwards}
.intro img{width:min(60vw,400px);animation:logoIn 1.1s cubic-bezier(.2,.9,.2,1.2) both;filter:drop-shadow(0 0 40px #ed1d5155)}
@keyframes logoIn{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:none}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.intro{display:none}}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--ink) 65%,transparent)}
.nav-in{display:flex;align-items:center;gap:18px;padding-block:14px;max-width:1280px;margin:0 auto}
.logo{height:28px;width:auto;display:block}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:6px 11px;border-radius:999px;color:var(--muted);font-size:14.5px;white-space:nowrap;position:relative}
.tab:hover{color:var(--text)}
.tab[aria-current="true"]{color:var(--text)}
.tab[aria-current="true"]::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:2px;border-radius:2px;background:var(--grad)}
.pill-cta{background:var(--grad);border:0;color:#fff;font-weight:600;padding:8px 16px;border-radius:999px;font-size:14.5px;white-space:nowrap;box-shadow:0 6px 22px #ed1d5140}
@media (max-width:900px){.tabs{display:none}.nav-in{justify-content:space-between}}

/* stage */
main{max-width:1280px;margin:0 auto;padding-block:8px 130px}
.slide{animation:inR .5s cubic-bezier(.2,.8,.2,1) both}
.slide.back{animation-name:inL}
@keyframes inR{from{opacity:.0001;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:.0001;transform:translateX(-28px)}to{opacity:1;transform:none}}
.rise>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.rise>*:nth-child(2){animation-delay:.07s}.rise>*:nth-child(3){animation-delay:.14s}.rise>*:nth-child(4){animation-delay:.21s}.rise>*:nth-child(5){animation-delay:.28s}.rise>*:nth-child(6){animation-delay:.35s}
@keyframes rise{from{opacity:.0001;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide,.rise>*{animation:none}}

.section{display:flex;flex-direction:column;gap:26px;padding-top:26px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted)}
.eyebrow b{color:var(--orange);font-weight:700}
.h-xl{font-size:clamp(46px,8vw,104px);font-weight:800;font-family:var(--f-quote);line-height:1.15}
.h-l{font-size:clamp(28px,4vw,50px);font-weight:750}
.h-m{font-size:21px;font-weight:700}
.lead{font-size:clamp(17px,1.6vw,20px);color:#ddd4d7;max-width:62ch}
.quote{font-family:var(--f-quote);font-size:clamp(22px,2.6vw,32px);line-height:1.45}
.small{font-size:14.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
button.card{text-align:left;transition:border-color .2s,transform .2s}
button.card:hover{border-color:#ed1d5170;transform:translateY(-3px)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:8px;padding:12px 22px;font-weight:600;font-size:16px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn-play{background:var(--text);color:var(--ink)}
.btn-ghost{background:#ffffff1f}
.btn-sm{padding:6px 12px;font-size:14px}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:3px 10px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff14;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.callout{border-left:3px solid var(--orange);padding:6px 0 6px 16px;color:#ddd4d7;max-width:72ch}
.foot-note{font-size:13px;color:var(--muted)}
.foot-note a{color:var(--muted)}
.big{font-family:var(--f-display);font-size:clamp(34px,4vw,52px);font-weight:800;line-height:1}
.dot-c0{background:var(--c0)}.dot-c5{background:var(--c5)}.dot-c1{background:var(--c1)}.dot-c2{background:var(--c2)}.dot-c3{background:var(--c3)}.dot-c4{background:var(--c4)}

/* hero */
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:560px;display:flex;align-items:flex-end;background:#120d12}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0c0a0dF0 0%,#0c0a0d99 50%,transparent 85%),linear-gradient(0deg,#0c0a0d 0%,transparent 50%);pointer-events:none}
.hero-copy{position:relative;z-index:1;padding:clamp(22px,5vw,64px);display:flex;flex-direction:column;gap:16px;max-width:800px}
.badge{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);font-weight:600}
.badge img{height:16px}
.countdown{display:flex;gap:10px;flex-wrap:wrap}
.cd{background:#ffffff10;border:1px solid #ffffff1c;border-radius:10px;padding:8px 12px;min-width:72px;text-align:center}
.cd b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.1}
.cd span{font-size:12px;color:var(--muted)}

/* arc */
.arc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.arc{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.arc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.arc{grid-template-columns:1fr}}
.chap{position:relative;border-radius:14px;padding:18px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;overflow:hidden;text-align:left}
.chap::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--cc)}
.chap .n{font-family:var(--f-display);font-size:15px;color:var(--cc);font-weight:700}
.chap .feel{font-family:var(--f-quote);font-size:25px;line-height:1.25}
.chap .glow{position:absolute;right:-40px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:var(--cc);opacity:.13;filter:blur(10px);transition:transform .4s}
.chap:hover .glow{transform:scale(1.4)}
.bridge{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:760px){.bridge{grid-template-columns:1fr}}
.bridge .mid{display:grid;place-items:center;gap:8px;text-align:center}
.bridge .mid img{height:30px}
.bridge .mid .arrow{font-size:28px;color:var(--orange)}
.days{display:flex;flex-wrap:wrap;gap:4px}
.days i{width:16px;height:16px;border-radius:3px;background:var(--cc);opacity:.35;position:relative;transition:transform .2s,opacity .2s}
.days i.occ{opacity:1}
.days i.occ::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ink)}
.days i:hover{transform:scale(1.5);opacity:1;z-index:1}
.threads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.thread{display:flex;gap:12px;align-items:flex-start}
.thread .k{flex:none;width:40px;height:40px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:#fff}

/* timeline explorer */
.tl-wrap{overflow-x:auto;padding-bottom:6px}
.tl{position:relative;min-width:1060px;height:186px}
.tl .band{position:absolute;height:10px;border-radius:5px;background:var(--cc);opacity:.85}
.tl .band span{position:absolute;top:14px;left:0;font-size:12.5px;color:var(--cc);white-space:nowrap;font-weight:600}
.tl .m{position:absolute;top:2px;font-size:12px;color:var(--muted);transform:translateX(-50%)}
.tl .occ{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:var(--cc);transform:translate(-50%,-50%);padding:0;transition:transform .2s,box-shadow .2s}
.tl .occ:hover{transform:translate(-50%,-50%) scale(1.25)}
.tl .occ[aria-pressed="true"]{transform:translate(-50%,-50%) scale(1.35);box-shadow:0 0 0 4px #ffffff40,0 0 24px var(--cc)}
.tl .occ.approx{background:repeating-linear-gradient(45deg,var(--cc) 0 3px,transparent 3px 6px);border-color:var(--cc)}
.tl .today{position:absolute;top:22px;bottom:0;width:2px;background:#ffffff50}
.tl .today span{position:absolute;bottom:-2px;left:6px;font-size:12px;white-space:nowrap}
.occ-card{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:14px;animation:rise .4s ease both}
@media (max-width:860px){.occ-card{grid-template-columns:1fr}}
.occ-head{border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(circle at 90% 10%,color-mix(in srgb,var(--cc) 40%,transparent),transparent 60%),var(--panel);border:1px solid var(--line)}
.occ-head .date{font-family:var(--f-display);font-size:clamp(40px,5vw,60px);font-weight:800;line-height:1;color:var(--cc)}
.occ-head .feel{font-family:var(--f-quote);font-size:22px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;margin:0}
.kv dt{color:var(--muted);font-size:14px;font-weight:600;padding-top:2px}
.kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}}
.occ-nav{display:flex;gap:8px}

/* content map */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14.5px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.ct{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;animation:rise .4s ease both}
.ct .art{height:96px;position:relative;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end}
.ct .art img{position:absolute;top:10px;right:12px;height:11px;opacity:.9}
.ct .art b{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.15;position:relative}
.ct .art span{font-size:12px;color:#ffffffc8;position:relative}
.ct .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.ct .type{font-size:13px;color:var(--muted)}
.ct .when{font-size:13.5px;font-weight:600}

/* audience */
.profiles{display:flex;gap:clamp(12px,2.6vw,30px);flex-wrap:wrap;justify-content:center}
.prof{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:126px}
.avatar{width:112px;height:112px;border-radius:12px;display:grid;place-items:center;border:3px solid transparent;transition:transform .25s,border-color .2s;font-family:var(--f-quote);font-size:40px;color:#fff;position:relative}
.avatar em{position:absolute;top:6px;right:6px;font-style:normal;font-family:var(--f-body);font-size:10.5px;font-weight:700;background:#000000a0;padding:1px 6px;border-radius:999px}
.prof:hover .avatar{transform:scale(1.06)}
.prof[aria-pressed="true"] .avatar{border-color:var(--text)}
.prof span{color:var(--muted);font-size:14.5px;text-align:center;line-height:1.35}
.prof[aria-pressed="true"] span{color:var(--text)}
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;animation:rise .4s ease both}
@media (max-width:820px){.seg{grid-template-columns:1fr}}

/* gen z */
.genz{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.genz{grid-template-columns:1fr;justify-items:center}}
.phone{width:270px;max-width:100%;aspect-ratio:9/18.5;border-radius:36px;border:8px solid #2b2428;background:#000;position:relative;overflow:hidden;box-shadow:0 30px 70px #00000080,0 0 0 1px #ffffff10}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:80px;height:20px;border-radius:12px;background:#000;z-index:3}
.reel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 54px 26px 16px;gap:8px;animation:reelIn .5s ease both}
@keyframes reelIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.reel .cap{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15}
.reel .tag{font-size:13.5px;color:#ffffffd8}
.reel .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.reel .who i{width:26px;height:26px;border-radius:50%;background:var(--grad);display:inline-block}
.reel .side{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:16px;align-items:center;font-size:11px}
.reel .side span{width:34px;height:34px;border-radius:50%;background:#ffffff26;display:grid;place-items:center}
.reel .bar{position:absolute;top:36px;left:14px;right:14px;height:3px;background:#ffffff30;border-radius:2px;overflow:hidden}
.reel .bar i{display:block;height:100%;background:#fff;width:0;animation:rb 4.5s linear forwards}
@keyframes rb{to{width:100%}}
.ideas{display:flex;flex-direction:column;gap:6px;width:100%}
.idea{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;width:100%}
.idea:hover{background:var(--panel)}
.idea[aria-pressed="true"]{background:var(--panel);border-color:var(--line)}
.idea .d{font-size:12.5px;color:var(--muted);white-space:nowrap}
.idea .k{width:10px;height:10px;border-radius:50%}
.idea b{font-weight:600}
.passport{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:760px){.passport{grid-template-columns:1fr}}
.pp{background:linear-gradient(160deg,#123a2a,#0d2219);border:1px solid #2fbf7a55;border-radius:14px;padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pp .t{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.stamp{aspect-ratio:1;border-radius:12px;border:2px dashed #ffffff30;background:none;display:grid;place-items:center;text-align:center;font-size:13px;color:#ffffff90;padding:8px;position:relative;max-width:100%}
.stamp.on{border-style:solid;border-color:var(--cc);color:var(--text);background:color-mix(in srgb,var(--cc) 18%,transparent);animation:stampIn .45s cubic-bezier(.3,1.6,.5,1) both}
.stamp.on b{font-family:var(--f-quote);font-size:20px;color:var(--cc);display:block;transform:rotate(-8deg)}
@keyframes stampIn{from{transform:scale(1.6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

/* cities */
.cities{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cities{grid-template-columns:1fr}}
.map{background:radial-gradient(circle at 80% 30%,#ed1d5118,transparent 60%),var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;overflow:hidden}
.map svg{width:100%;height:auto;display:block}
.map .path{fill:none;stroke:url(#pg);stroke-width:1.4;stroke-dasharray:4 6;animation:dash 2.5s linear infinite;opacity:.6}
@keyframes dash{to{stroke-dashoffset:-40}}
@media (prefers-reduced-motion:reduce){.map .path{animation:none}}
.map .city{cursor:pointer}
.map .city circle.ring{fill:none;stroke:var(--orange);stroke-width:2;opacity:0}
.map .city.on circle.ring{opacity:1;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{r:8;opacity:.9}to{r:22;opacity:0}}
.map text{font-family:var(--f-body);font-size:13px;fill:var(--text)}
.map .city.on text{font-weight:700;fill:var(--orange)}
.citylist{display:flex;flex-wrap:wrap;gap:6px}
.citylist button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.citylist button[aria-pressed="true"]{background:var(--text);color:var(--ink)}

/* stories */
.family{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.member{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.member i{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-quote);font-size:18px;color:#0c0a0d;background:var(--cc)}
.trailer{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.trailer .frame{aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden}
.trailer .scene{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px;font-family:var(--f-quote);font-size:19px;line-height:1.4;opacity:0;transition:opacity .6s;text-shadow:0 2px 12px #000}
.trailer .scene.on{opacity:1}
.trailer .scene.last{align-items:center;justify-content:center;text-align:center;font-size:23px}
.trailer .play{position:absolute;inset:0;margin:auto;width:58px;height:58px;border-radius:50%;background:#ffffffe6;display:grid;place-items:center;color:var(--ink);transition:opacity .3s,transform .3s}
.trailer.playing .play{opacity:0;transform:scale(.6)}

      <div class="badge"><img src="${LOGO}" alt="চরকি"> ক্যাম্পেইন · যুক্তরাষ্ট্র ও কানাডা · নভেম্বর ২০২৬ – মার্চ ২০২৭</div>
      <h1 class="h-xl">দেশ থাকে গল্পে</h1>
      <div class="quote gt">বিজয় থেকে স্বাধীনতা, ১০০ দিনের গল্প</div>
      <p class="lead">থ্যাংকসগিভিং আর ব্ল্যাক ফ্রাইডেতে “ঘরে ফেরার গল্প” দিয়ে ভূমিকা। তারপর ১৬ ডিসেম্বর থেকে ২৬ মার্চ, ঠিক ১০০ দিন: বিজয় দিবস, থার্টি-ফার্স্ট, পিঠা, ফাগুন, একুশ, রমজান, ঈদ আর স্বাধীনতা। সব উপলক্ষ এক গল্পে বেঁধে চরকি হবে বরফের দেশে বাঙালির ঘর।</p>
      <div><div class="eyebrow" id="cdLabel" style="margin-bottom:8px">প্রথম দিন শুরু হতে বাকি</div><div class="countdown" id="cd"></div></div>
      <div class="row">
        <button class="btn btn-play" data-go="idea">${ICON_PLAY} চলুন শুরু করি</button>
        <button class="btn btn-ghost" data-go="calendar">ক্যালেন্ডার দেখুন</button>
      </div>
    </div>
  </section>`},

 {id:'idea',tab:'বড় আইডিয়া',title:'এক গল্প, চার অধ্যায়',html:()=>`

 {id:'titles',tab:'নাম',title:'গল্পের নাম',html:()=>`
  <div class="section">
    <div class="stack rise"><div class="eyebrow">ক্যাম্পেইনের নাম</div>
    <h2 class="h-l">এক ছাতা, প্রতিটি অধ্যায়ের নিজের নাম। সব নাম শেষ হয় “গল্প”-এ।</h2>
    <p class="lead">ছাতার নাম “দেশ থাকে গল্পে” পুরো মৌসুম জুড়ে থাকে। প্রতিটি অধ্যায় পায় একটা “…র গল্প” নাম, তাই আলাদা ক্যাম্পেইন হয়েও সবগুলো এক পরিবারের মনে হয়। পছন্দের নাম বেছে নিন, পুরো প্রেজেন্টেশনে সেটাই বসবে।</p></div>
    <div class="tsys rise">
      <div class="stack" id="trows"></div>
      <div class="stack"><div class="fmt" id="fmt">${[['16/9','ব্যানার'],['1/1','ফিড পোস্ট'],['9/16','স্টোরি']].map((f,i)=>`<button data-r="${f[0]}" aria-pressed="${i===0}">${f[1]}</button>`).join('')}</div><div class="bwrap"><div class="banner" id="banner"></div></div><p class="small" id="twhy"></p></div>
    </div>
  </div>`},
 {id:'calendar',tab:'ক্যালেন্ডার',title:'১০০ দিনের ক্যালেন্ডার',html:()=>`
  <div class="section">
    <div class="stack rise"><div class="eyebrow">উপলক্ষ ধরে পরিকল্পনা</div>
    <h2 class="h-l">১৯টা উপলক্ষ, তার ছয়টা বড়। প্রতিটিতে একটা অনুভূতি, একটা গল্প, একটা কাজ।</h2>
    <p class="lead">টাইমলাইনের যেকোনো বিন্দুতে চাপ দিন। বড় বিন্দু মানে বড় উপলক্ষ, যেখানে বাজেটের বেশিরভাগ যাবে। ডোরাকাটা বিন্দুর তারিখ চাঁদ দেখার ওপর নির্ভর করে।</p></div>
    <div class="tl-wrap rise"><div class="tl" id="tl"></div></div>
    <div id="occCard"></div>
    <div class="callout">রমজান শুরু হবে ফাগুন আর একুশের আগেই, আনুমানিক ৮ ফেব্রুয়ারি। তাই ফেব্রুয়ারিতে দুটো অধ্যায় পাশাপাশি চলবে, আর ভালোবাসা দিবসের ক্রিয়েটিভ থাকবে উষ্ণ, সংযত ও পারিবারিক।</div>
    <p class="foot-note">তারিখের উৎস: রমজান ও ঈদ <a href="https://www.thenationalnews.com/news/uae/2026/09/09/ramadan-2027-dates-eid-al-fitr-holiday/" target="_blank" rel="noopener">The National</a> (আনুমানিক) · সরস্বতী পূজা ও দোলযাত্রা <a href="https://www.officeholidays.com/holidays/india/west-bengal/vasant-panchami" target="_blank" rel="noopener">Office Holidays</a> · পহেলা ফাল্গুন ১৪ ফেব্রুয়ারি <a href="https://www.dhakatribune.com/bangladesh/201026/pohela-falgun-to-be-celebrated-on-valentine-s-day" target="_blank" rel="noopener">Dhaka Tribune</a></p>
  </div>`},

 {id:'content',tab:'কন্টেন্ট',title:'কোন দিনে কোন গল্প',html:()=>`
  <div class="section">
    <div class="stack rise"><div class="eyebrow">চরকির কন্টেন্ট ম্যাপ</div>
    <h2 class="h-l">নতুন কিছু বানানোর আগে একটু চরকির তাকে তাকাই। প্রায় প্রতিটা উপলক্ষের গল্প ওখানেই আছে।</h2>
    <p class="lead">অধ্যায় বেছে নিন। প্রতিটা কার্ডে লেখা কবে দেখাব আর কেন মানায়।</p></div>
    <div class="filters rise" id="cf">${['সব',0,1,2,3,4].map((k,i)=>`<button data-f="${k}" aria-pressed="${i===0}">${k==='সব'?'সব অধ্যায়':CH[k].n+': '+T(k)}</button>`).join('')}</div>
    <div class="card rise" style="gap:10px"><b>প্রতিটা অধ্যায়ে নতুন রিলিজের জন্য একটা জায়গা খালি রাখছি</b><div class="chips">${[[0,'থ্যাংকসগিভিং প্রিমিয়ার'],[1,'ডিসেম্বরের নতুন রিলিজ'],[2,'জানুয়ারির নতুন সিরিজ'],[3,'ফাগুনের প্রেমের গল্প'],[4,'ঈদ অরিজিনাল']].map(x=>chip(x[1],x[0])).join('')}</div><span class="small">শুধু পুরোনো গল্পে চার মাস টানা কঠিন, নতুন দর্শক আসে নতুন গল্পে। চরকির “দম” যুক্তরাষ্ট্র-কানাডায় দেখানো গেলে সেটাও একটা অধ্যায়ের বড় চমক হতে পারে।</span></div>
    <div class="cgrid" id="cgrid"></div>
    <p class="foot-note">ছোট্ট সতর্কতা: কোন টাইটেল এখন চরকিতে আছে আর যুক্তরাষ্ট্র-কানাডায় দেখানো যাবে কি না, শুরুর আগে কন্টেন্ট টিমের সাথে মিলিয়ে নেব। উৎস: <a href="https://en.wikipedia.org/wiki/Chorki" target="_blank" rel="noopener">Wikipedia</a>, <a href="https://www.thedailystar.net/node/2990726" target="_blank" rel="noopener">The Daily Star</a>, <a href="https://www.tbsnews.net/glitz/chorkis-jago-bahey-highlight-language-movement-liberation-war-341092" target="_blank" rel="noopener">TBS</a>, <a href="https://www.thedailystar.net/culture/tv-film/news/surongo-forget-me-not-emerge-top-winners-chorki-awards-4215571" target="_blank" rel="noopener">চরকি অ্যাওয়ার্ডস</a>, <a href="https://en.wikipedia.org/wiki/Utshob" target="_blank" rel="noopener">উৎসব</a>।</p>
  </div>`},

 {id:'audience',tab:'দর্শক',title:'কারা দেখবে',html:()=>`

 {id:'genz',tab:'জেনজি',title:'জেনজির জন্য',html:()=>`

    <div class="stack rise"><div class="eyebrow">জেনজি কর্নার</div>
    <h2 class="h-l">জেনজি বিজ্ঞাপন দেখে না, ট্রেন্ড বানায়। প্রতিটি উপলক্ষে একটা ট্রেন্ড।</h2>
    <p class="lead">ইংরেজি সাবটাইটেল, ছোট ফরম্যাট, আর নিজের পরিবারের গল্প।</p></div>

      <div class="pp" id="pp"><div class="t"><b>দেশ থাকে গল্পে · পাসপোর্ট</b><img src="${LOGO}" alt="" style="height:14px"></div>${[1,2,3,4].map(k=>`<button class="stamp" data-k="${k}" style="--cc:var(--c${k})">${CH[k].n}<br>${CH[k].name}</button>`).join('')}<div class="t small" id="ppMsg" style="grid-column:1/-1">০ / ৪ স্ট্যাম্প</div></div>

  </div>`},

 {id:'cities',tab:'শহর',title:'শহরে শহরে',html:()=>`

    <div class="stack rise"><div class="eyebrow">শহরভিত্তিক প্রচার</div>
    <h2 class="h-l">নয়টা শহর, প্রতিটির নিজের উপলক্ষ। আর সব পথ ফিরে যায় বাড়ির দিকে।</h2></div>

 {id:'stories',tab:'আবেগের গল্প',title:'এক পরিবার, চার শহর',html:()=>`
  <div class="section">
    <div class="stack rise"><div class="eyebrow">ক্রিয়েটিভ</div>
    <h2 class="h-l">এক পরিবার, চার শহর, পাঁচটা ছবি।</h2>
    <p class="lead">ভূমিকায় একটা হাসির ছবি, তারপর চার অধ্যায়ে চারটা আবেগের ছবি। সবগুলোতে একই পরিবারের মানুষ, চার শহরে। চরকি শুধু পটভূমি, গল্পটা পরিবারের। ২৬ মার্চের শেষ ছবিতে সবাই এক ভিডিও কলে।</p></div>
    <div class="family rise">${FAMILY.map(f=>`<div class="member" style="--cc:var(--c${f[3]})"><i>${f[0]}</i><div><b>${f[1]}</b><div class="small">${f[2]}</div></div></div>`).join('')}</div>
    <div class="rail-h row" style="justify-content:space-between"><h3 class="h-m">হিরো ফিল্ম</h3><span class="small">চাপ দিলে স্টোরিবোর্ড চলবে</span></div>

    <div class="grid g2 rise">
      <div class="card"><h3 class="h-m">শুটিং কীভাবে করব</h3><p class="small" style="color:var(--text)">নিউইয়র্ক–নিউ জার্সিতে এক সপ্তাহে তিনটা ছবি একসাথে, দরকার হলে আয়েশার গল্প ব্রুকলিনে। টরন্টোর ছবি ওখানকার একটা প্রোডাকশন টিমকে দিয়ে। আর প্রথম ছবিটা আর্কাইভ আর দর্শকের পাঠানো ভিডিও দিয়ে, যাতে থ্যাংকসগিভিংয়ের ব্যস্ততার মধ্যেও ১৬ ডিসেম্বরে রেডি থাকে।</p></div>
      <div class="card"><h3 class="h-m">তারকারাও থাকবেন</h3><p class="small" style="color:var(--text)">বিজয় দিবস আর ঈদে চরকির তারকাদের ছোট ভিডিও চিঠি, কয়েকজন দর্শককে নাম ধরে। ঈদে নিউইয়র্কে তারকাদের নিয়ে একটা স্ক্রিনিং বা আড্ডা। “উৎসব” তো যুক্তরাষ্ট্র-কানাডার হলেও চলেছে, রাস্তা চেনাই আছে।</p></div>
    </div>
    <div class="card rise" style="background:linear-gradient(120deg,#ed1d5122,var(--panel) 60%)"><span class="eyebrow">২৬ মার্চের সমাপ্তি</span><div class="quote">“১০০ দিনের চিঠি”</div><p class="small" style="color:var(--text)">চার শহরের পরিবার এক ভিডিও কলে, ঢাকা থেকে বড় নানুও। সাথে দর্শকদের পাঠানো #নানুর৭১ ভিডিও। শেষ লাইন: “স্বাধীনতা মানে নিজের গল্প নিজের ভাষায় দেখা।”</p></div>
  </div>`},

 {id:'measure',tab:'KPI',title:'কীভাবে বুঝব কাজ হচ্ছে',html:()=>`
  <div class="section">

    <div class="tbl rise"><table><thead><tr><th>কী দেখব</th><th>কত চাই</th><th>কীভাবে বুঝব</th></tr></thead><tbody>

      <tr><td>২৬ মার্চেও দেখছেন</td><td>নতুন গ্রাহকের অন্তত ৬৫%</td><td>শেষ ৭ দিনে অন্তত একটা কিছু দেখেছেন</td></tr>
      <tr><td>পাসপোর্টের চার স্ট্যাম্প</td><td>নতুন গ্রাহকের ১৫%</td><td>অ্যাপে স্ট্যাম্প গোনা</td></tr>
      <tr><td>পাস থেকে বছরের প্ল্যানে</td><td>পাসধারীদের ২৫%</td><td>২৬ মার্চের পরের ৭ দিন</td></tr>
      <tr><td>জেনজির পোস্ট</td><td>প্রতি অধ্যায়ে একটা ট্রেন্ড, ৫০০+ পোস্ট</td><td>হ্যাশট্যাগ আর ক্রিয়েটরদের রিপোর্ট</td></tr>
      <tr><td>অধ্যায় শেষের থামার জায়গা</td><td>লক্ষ্যের ৮০% হলে পরের অধ্যায়ের পুরো টাকা</td><td>অধ্যায় শেষের ৩ দিনের মধ্যে বসা</td></tr>
    </tbody></table></div>
    <div class="grid g3 rise">

        <li><b>রাজনীতি না।</b> দেশ আর মানুষের গল্প, কোনো দল বা নেতার না। ১৬ ডিসেম্বর আর ২৬ মার্চের প্রতিটা কপি ছাড়ার আগে আরেকবার দেখে নেব।</li>
        <li><b>সবার উৎসব।</b> ঈদ, পূজা, বড়দিন, দোল, সবই আমাদের।</li>
        <li><b>রমজানে নরম সুর।</b> নামাজ বা ধর্মীয় মুহূর্তের পাশে বিক্রির কথা না।</li>
        <li><b>চাঁদের জন্য রেডি।</b> ঈদের সব ক্রিয়েটিভ দুই তারিখের জন্যই তৈরি থাকবে।</li>
        <li><b>হাসি আর কান্না পাশাপাশি।</b> প্রতিটা আবেগের ছবির পাশে একটা মজার জিনিস, কারণ চরকি মানে সাহসী আর মজারও।</li></ul></div>
      <div class="card"><h3 class="h-m">চরকি থেকে যা লাগবে</h3><ul class="easy">
        <li>যুক্তরাষ্ট্র-কানাডায় এখন কত গ্রাহক, আয় কত, কতজন ছেড়ে যান</li>
        <li>বছর আর মাসের প্ল্যানের আসল দাম</li>

        <li>কোন কোন টাইটেল যুক্তরাষ্ট্র-কানাডায় দেখানো যাবে</li>
        <li>স্পনসরদের সাথে কথা শুরু করার সবুজ সংকেত</li></ul></div>
      <div class="card"><h3 class="h-m">সামনের তারিখগুলো</h3><div class="next">
        <div class="hot"><b>১২ নভেম্বর</b><span class="small">থ্যাংকসগিভিংয়ের সব ফাইনাল; অ্যাপ স্টোরে অফার জমা</span></div>
        <div class="hot"><b>২০ নভেম্বর</b><span class="small">নাম, অফার, বাজেট আর স্পনসর নিয়ে হ্যাঁ/না; চরকির সংখ্যাগুলো হাতে</span></div>
        <div class="hot"><b>২৬ নভেম্বর</b><span class="small">ভূমিকা শুরু, পাসপোর্টের প্রথম পাতা</span></div>
        <div><b>২ ডিসেম্বর</b><span class="small">প্রথম থামার জায়গা; টিজার শুরু</span></div>
        <div><b>১০ ডিসেম্বর</b><span class="small">পাস, পাসপোর্ট, ঢাকার ঘড়ি রেডি; তারকাদের ভিডিও চিঠি রেকর্ড</span></div>
        <div class="hot"><b>১৬ ডিসেম্বর</b><span class="small">দিন ০</span></div>
        <div><b>জানুয়ারির শুরু</b><span class="small">এক সপ্তাহের শুটিং; টিকিট-ড্র-এর শর্ত ফাইনাল</span></div>
      </div></div>

 {id:'production',tab:'নতুন প্রোডাকশন',title:'নতুন প্রোডাকশন',html:()=>`
  <div class="section">

];

/* router */
const stage=document.getElementById('stage'),tabs=document.getElementById('tabs'),scrub=document.getElementById('scrub');
tabs.innerHTML=SLIDES.map(s=>`<button class="tab" data-go="${s.id}">${s.tab}</button>`).join('');
scrub.innerHTML=SLIDES.map((s,i)=>`<button data-go="${s.id}" aria-label="স্লাইড ${bn(i+1)}: ${s.tab}" title="${s.tab}"></button>`).join('');
let cur=0,raf=null,timers=[],pendingCh=null,pendingOcc=null,pendingTab=null;
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const every=(f,ms)=>timers.push(setInterval(f,ms));
function show(id,push){
  const i=Math.max(0,SLIDES.findIndex(s=>s.id===id));
  const dir=i<cur?'back':'';cur=i;const s=SLIDES[i];
  timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];cancelAnimationFrame(raf);
  stage.innerHTML=`<div class="slide ${dir}">${s.html()}</div>`;
  tabs.querySelectorAll('.tab').forEach((t,j)=>t.setAttribute('aria-current',j===i));
  scrub.querySelectorAll('button').forEach((b,j)=>{b.className=j<i?'done':j===i?'cur':'';b.style.removeProperty('--p')});
  document.getElementById('counter').textContent=`${bn(String(i+1).padStart(2,'0'))} / ${bn(SLIDES.length)}`;
  document.getElementById('now').textContent=s.title;
  if(push!==false&&location.hash!=='#'+s.id)history.replaceState(null,'','#'+s.id);
  window.scrollTo({top:0});
  mount(s.id);if(auto)startAuto();
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){pendingCh=g.dataset.ch!=null?+g.dataset.ch:null;pendingOcc=g.dataset.occ||null;pendingTab=g.dataset.tab||null;show(g.dataset.go)}});
const go=d=>show(SLIDES[Math.min(SLIDES.length-1,Math.max(0,cur+d))].id);
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));
let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null||e.target.closest('.tl-wrap,input,.tbl'))return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70)go(d<0?1:-1);tx=null});

/* autoplay */
let auto=false,autoRaf=null;const AUTO_MS=14000;const autoBtn=document.getElementById('auto');
function paintAuto(){autoBtn.innerHTML=auto?ICON_PAUSE:ICON_PLAY.replace('currentColor','#fff');autoBtn.setAttribute('aria-pressed',auto);autoBtn.setAttribute('aria-label',auto?'অটোপ্লে থামান':'অটোপ্লে')}
function startAuto(){cancelAnimationFrame(autoRaf);const t0=performance.now();const b=scrub.querySelectorAll('button')[cur];
  const tick=n=>{if(!auto)return;const p=Math.min(1,(n-t0)/AUTO_MS);b.style.setProperty('--p',p*100+'%');if(p>=1){if(cur<SLIDES.length-1)go(1);else{auto=false;paintAuto()}}else autoRaf=requestAnimationFrame(tick)};autoRaf=requestAnimationFrame(tick)}
autoBtn.onclick=()=>{auto=!auto;paintAuto();if(auto)startAuto();else{cancelAnimationFrame(autoRaf);scrub.querySelectorAll('button')[cur].style.removeProperty('--p')}};paintAuto();

/* slide behaviour */
function mount(id){
  if(id==='home'){snow();
    const el=document.getElementById('cd'),lab=document.getElementById('cdLabel');
    const TG=Date.UTC(2026,10,26,5,0);const draw=()=>{const now=Date.now();if(now<TG)lab.textContent='ভূমিকা “'+T(0)+'” শুরু হতে বাকি';else if(now<LAUNCH_ET)lab.textContent='১০০ দিনের যাত্রা শুরু হতে বাকি';let ms=(now<TG?TG:LAUNCH_ET)-now;
      if(ms<=0){const d=Math.min(100,Math.floor((Date.now()-START)/DAY));lab.textContent='যাত্রা চলছে';el.innerHTML=`<div class="cd"><b class="gt">দিন ${bn(d)}</b><span>১০০-র মধ্যে</span></div>`;return}
      const d=Math.floor(ms/DAY);ms%=DAY;const h=Math.floor(ms/36e5);ms%=36e5;const m=Math.floor(ms/6e4);const s=Math.floor(ms%6e4/1e3);
      el.innerHTML=[[d,'দিন'],[h,'ঘণ্টা'],[m,'মিনিট'],[s,'সেকেন্ড']].map(x=>`<div class="cd"><b>${bn(String(x[0]).padStart(2,'0'))}</b><span>${x[1]}</span></div>`).join('')};
    draw();every(draw,1000)}
  if(id==='idea'){
    const box=document.getElementById('days'),hv=document.getElementById('dayHover');const TL0=Date.UTC(2026,10,26);
    const iso=ms=>new Date(ms).toISOString().slice(0,10);
    const chOf=t=>t<='2026-12-01'?0:t<='2026-12-31'?1:t<='2027-01-31'?2:t<'2027-02-22'?(t>='2027-02-08'&&!OCC.some(o=>o.d===t&&o.ch===3)?4:3):4;
    let h='',n=0;const cell=t=>{const o=OCC.find(x=>x.d===t);return `<i class="${o?'occ':''}" style="--cc:var(--c${o?o.ch:chOf(t)});animation:rise .3s ${(n++)*7}ms both" data-t="${t}" data-n="${o?o.name:''}"></i>`};
    for(let k=0;k<6;k++)h+=cell(iso(TL0+k*DAY));
    h+='<span class="gap">১৪ দিনের টিজার</span>';
    for(let k=0;k<=100;k++)h+=cell(iso(START+k*DAY));
    box.innerHTML=h;
    box.onmouseover=e=>{const i=e.target.closest('i');if(!i)return;hv.textContent=`${fmtD(i.dataset.t)}, ${wday(i.dataset.t)}${i.dataset.n?' · '+i.dataset.n:''}`};
  }
  if(id==='calendar'){
    const TL0=Date.UTC(2026,10,26),TOT=120,tl=document.getElementById('tl');const P=x=>((dOf(x)-TL0)/DAY/TOT*96+2);
    const months=[['2026-11-26','নভেম্বর'],['2026-12-02','ডিসেম্বর'],['2027-01-01','জানুয়ারি'],['2027-02-01','ফেব্রুয়ারি'],['2027-03-01','মার্চ']];
    let h=months.map(m=>`<span class="m" style="left:${P(m[0])}%">${m[1]}</span>`).join('');

      document.getElementById('otrack').innerHTML=OFFERS2.map((o,i)=>{const p=o.p(L,M);return `<div class="ocard ${o.big?'big':''} ${path?(path.includes(o.k)?'hl':'dim'):''}" style="--cc:var(--c${o.ch})"><span class="no">${bn(i+1)}</span><span class="d">${o.d}</span><span class="nm">${o.n}</span>${o.big?'<span class="chip" style="align-self:flex-start;color:var(--cc)">বড় অফার</span>':''}<span class="pr">${m2(p)} <small>/ ${o.per}</small></span><span class="pm">${o.m&&p?'মাসে পড়ে '+m2(p/o.m):''}</span><span class="small" style="color:#ddd4d7">${o.how}</span><span class="small">কার জন্য: ${o.who}</span></div>`}).join('');
      const pn=document.getElementById('pnote');
      if(pi<0)pn.innerHTML=`<div class="callout">বছরের দাম ${m2(L)} হলে থ্যাংকসগিভিংয়ে সেটা ${m2(L*.5)}, মানে মাসে ${m2(L*.5/12)}। গত ব্ল্যাক ফ্রাইডেতে বড় স্ট্রিমিংগুলোর সবচেয়ে কম দাম ছিল মাসে $২.৯৯। আমাদের অফার এর কাছাকাছি বা নিচে থাকলেই চোখে পড়বে।</div>`;
      else{const P=PERS[pi];const tot=P.path.reduce((a,k)=>a+OFFERS2.find(o=>o.k===k).p(L,M),0);pn.innerHTML=`<div class="card" style="animation:rise .35s ease both"><span class="eyebrow">${P.n}</span><div style="font-size:18px">${P.note}</div><div class="row"><span class="big">${m2(tot)}</span><span class="small">এই মৌসুমে এমন একজনের কাছ থেকে চরকির আয় (উদাহরণ)</span></div></div>`}};
    iL.oninput=draw;iM.oninput=draw;
    document.getElementById('persona').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;pi=+b.dataset.p;document.querySelectorAll('#persona [data-p]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
    draw();
  }
  if(id==='budget'){
    const r=document.getElementById('budget'),sp=document.getElementById('spon');r.value=store.get('ck100-b',40000);sp.value=store.get('ck100-s',20);
    const bars=document.getElementById('bars');
    bars.innerHTML=CHANNELS.map((c,i)=>`<div class="bar ${i===0?'lead':''}"><div><b>${c[0]}</b><div class="small">${c[2]}</div></div><div class="track"><div class="fill">${bn(c[1])}%</div></div><div class="amt"></div></div>`).join('');
    document.getElementById('spons').innerHTML=SPONS.map(x=>chip(`${CH[x[0]].n}: ${x[1]}`,x[0])).join('');
    const bigTot=BIGS.reduce((a,b)=>a+b[1],0),bmax=Math.max(...BIGS.map(b=>b[1]));
    const draw=()=>{const t=+r.value,sh=+sp.value;store.set('ck100-b',t);store.set('ck100-s',sh);
      const sv=t*sh/100,net=t-sv,subs=Math.round(t/8.5);
      document.getElementById('bOut').textContent=usd(t);document.getElementById('sOut').textContent=bn(sh)+'%';
      document.getElementById('tiles').innerHTML=[[usd(t),'মোট বাজেট'],[usd(sv),'স্পনসর দেবে'],[usd(net),'চরকির নিজের খরচ'],[bn(subs.toLocaleString('en-US')),'নতুন গ্রাহক, প্রতি গ্রাহকে $৮.৫০ ধরে',1],['$'+bn((subs?net/subs:0).toFixed(2)),'স্পনসর বাদ দিয়ে প্রতি গ্রাহকে খরচ',1]].map(x=>`<div class="tile ${x[2]?'hot':''}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
      let g=`<svg viewBox="0 0 520 250" role="img" aria-label="মাসে মাসে বাজেট" style="width:100%;height:auto;display:block;margin-top:8px">`;
      MONTHS.forEach((m,i)=>{const x=20+i*100+22,h=m[1]/30*160,y=210-h;
        g+=`<rect x="${x}" y="${y}" width="56" height="${h}" rx="5" fill="var(--c${m[2]})"><title>${m[0]}: ${usd(t*m[1]/100)}</title></rect><text x="${x+28}" y="${y-8}" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">${usd(t*m[1]/100)}</text><text x="${x+28}" y="232" text-anchor="middle" fill="var(--muted)" font-size="13">${m[0]}</text>`;
        if(m[3]){const gx=20+(i+1)*100;g+=`<line x1="${gx}" y1="40" x2="${gx}" y2="210" stroke="var(--line)" stroke-dasharray="3 4"/><path d="M${gx} 22 l7 7 -7 7 -7 -7z" fill="var(--orange)"/><text x="${gx}" y="15" text-anchor="middle" fill="var(--muted)" font-size="11">${m[3]}</text>`}});
      g+=`<line x1="10" y1="210" x2="510" y2="210" stroke="var(--line)"/></svg>`;
      document.getElementById('mchart').innerHTML=g;
      document.getElementById('split').innerHTML=`<div style="flex:${bigTot};background:var(--grad)">বড় দিন ${bn(bigTot)}% · ${usd(t*bigTot/100)}</div><div style="flex:${100-bigTot};background:#ffffff22;color:var(--text)">সারা মৌসুম ${bn(100-bigTot)}%</div>`;
      document.getElementById('bigs').innerHTML=BIGS.map(b=>`<div class="brow"><span><i class="dt dot-c${b[2]}"></i>${b[0]}</span><span class="t"><i style="width:${b[1]/bmax*100}%;background:var(--c${b[2]})"></i></span><b>${usd(t*b[1]/100)}</b></div>`).join('');
      bars.querySelectorAll('.amt').forEach((a,i)=>a.textContent=usd(t*CHANNELS[i][1]/100))};
    r.oninput=draw;sp.oninput=draw;draw();
    requestAnimationFrame(()=>requestAnimationFrame(()=>bars.querySelectorAll('.fill').forEach((f,i)=>f.style.width=CHANNELS[i][1]/30*100+'%')));
  }
}

/* cover: snowflakes that slowly turn into marigold petals as they fall */
function snow(){
  const c=document.getElementById('snow');if(!c)return;const x=c.getContext('2d');
  let w,h;const dpr=Math.min(2,devicePixelRatio||1);
  const size=()=>{w=c.clientWidth;h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)};size();
  const P=Array.from({length:110},()=>({x:Math.random(),y:Math.random(),r:Math.random()*2.6+.8,v:Math.random()*.0012+.0005,a:Math.random()*6,s:Math.random()}));
  let t=0,mx=0;c.parentElement.onmousemove=e=>{const b=c.getBoundingClientRect();mx=((e.clientX-b.left)/b.width-.5)};
  const frame=()=>{if(!document.body.contains(c))return;if(c.clientWidth!==w)size();x.clearRect(0,0,w,h);
    const g=x.createRadialGradient(w*.78,h*.35,0,w*.78,h*.35,Math.min(w,h)*.7);g.addColorStop(0,'rgba(237,29,81,.35)');g.addColorStop(.5,'rgba(245,132,42,.12)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
    P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(t+p.a)*.0004+mx*.0006;if(p.y>1.03){p.y=-.03;p.x=Math.random()}if(p.x<-.02)p.x=1.02;if(p.x>1.02)p.x=-.02;
      const k=Math.min(1,Math.max(0,(p.y-.35)/.5));const px=p.x*w,py=p.y*h;
      if(k<.5||p.s<.55){x.fillStyle=`rgba(255,255,255,${.75-k*.4})`;x.beginPath();x.arc(px,py,p.r,0,7);x.fill()}
      else{x.save();x.translate(px,py);x.rotate(t*2+p.a);x.fillStyle=p.s>.8?'rgba(247,181,0,.85)':'rgba(245,132,42,.85)';x.beginPath();x.ellipse(0,0,p.r*2.2,p.r*1.1,0,0,7);x.fill();x.restore()}});
    t+=.01;if(!REDUCE)raf=requestAnimationFrame(frame)};
  frame();
}
